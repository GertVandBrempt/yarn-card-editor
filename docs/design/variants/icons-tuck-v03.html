<!-- icon-demo: icons-tuck-v03 | tuck-character (yellow), tuck-item (teal) with bold arrow -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #ffffff; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- tuck-character: overlapping cards, yellow, person pip, bold filled chevron arrow -->
  <symbol id="icon-tuck-character" viewBox="0 0 24 24">
    <!-- back card -->
    <rect x="5" y="4" width="11" height="14" rx="1.5"
          fill="#6a5c08" stroke="#1a0e04" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- front card -->
    <rect x="2" y="2" width="11" height="14" rx="1.5"
          fill="#d4cc30" stroke="#1a0e04" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- person pip: head -->
    <circle cx="7.5" cy="6.5" r="1.5" fill="#1a0e04"/>
    <!-- person pip: body -->
    <path d="M4.5 12.5 Q4.5 9.5 7.5 9.5 Q10.5 9.5 10.5 12.5"
          fill="#1a0e04" stroke="none"/>
    <!-- bold filled chevron arrow pointing down -->
    <polygon points="12,16 16,16 19,20 22,16 18,16 18,13 16,13 16,16"
             fill="#1a0e04" stroke="#1a0e04" stroke-width="1"
             stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- tuck-item: overlapping cards, teal, diamond pip, bold filled chevron arrow -->
  <symbol id="icon-tuck-item" viewBox="0 0 24 24">
    <!-- back card -->
    <rect x="5" y="4" width="11" height="14" rx="1.5"
          fill="#206070" stroke="#1a0e04" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- front card -->
    <rect x="2" y="2" width="11" height="14" rx="1.5"
          fill="#40a0c0" stroke="#1a0e04" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- diamond pip -->
    <polygon points="7.5,5.5 10,8.5 7.5,12 5,8.5"
             fill="#1a0e04" stroke="none"/>
    <!-- bold filled chevron arrow pointing down -->
    <polygon points="12,16 16,16 19,20 22,16 18,16 18,13 16,13 16,16"
             fill="#1a0e04" stroke="#1a0e04" stroke-width="1"
             stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-tuck-character" width="48" height="48"/></svg>
<svg width="48" height="48"><use href="#icon-tuck-item" width="48" height="48"/></svg>

</body>
</html>
