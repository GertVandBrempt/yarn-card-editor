<!-- icon-demo: icons-action-v02 | move, scout, gain-action -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #12100a; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <symbol id="icon-move" viewBox="0 0 24 24">
    <polygon points="2,8 14,8 14,4 22,12 14,20 14,16 2,16"
             fill="#d0c8a0" stroke="#1a0e04" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-scout" viewBox="0 0 24 24">
    <path d="M2,12 C5,6 19,6 22,12 C19,18 5,18 2,12 Z"
          fill="#40c8d0" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-gain-action" viewBox="0 0 24 24">
    <polygon points="14,2 8,13 13,13 10,22 16,11 11,11"
             fill="#f0c030" stroke="#1a0e04" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-move"/></svg>
<svg width="48" height="48"><use href="#icon-scout"/></svg>
<svg width="48" height="48"><use href="#icon-gain-action"/></svg>

</body>
</html>
