<!-- icon-demo: icons-combat-v01 | damage, shield, heal icons -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #12100a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Cinzel', Georgia, serif;
}
.demo-panel {
  display: flex;
  gap: 56px;
  align-items: flex-end;
  padding: 48px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(122,72,24,0.25);
  border-radius: 12px;
}
.icon-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.icon-sizes {
  display: flex;
  gap: 20px;
  align-items: flex-end;
}
.icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.size-label {
  color: rgba(200,134,12,0.4);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.icon-label {
  color: #c8860c;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 4px;
}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- DAMAGE: sword blade pointing down-left with a crossguard -->
  <symbol id="icon-damage" viewBox="0 0 24 24">
    <!-- blade: elongated diamond tapering to a point at bottom-left -->
    <polygon
      points="18,3 21,6 9,18 6,15"
      fill="#e84020"
      stroke="#1a0e04" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- blade tip triangle to sharp point -->
    <polygon
      points="9,18 6,15 4,20"
      fill="#e84020"
      stroke="#1a0e04" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- crossguard bar -->
    <line
      x1="16" y1="8" x2="8" y2="16"
      stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <line
      x1="13.5" y1="5.5" x2="18.5" y2="10.5"
      stroke="#e84020" stroke-width="4" stroke-linecap="round"/>
    <line
      x1="13.5" y1="5.5" x2="18.5" y2="10.5"
      stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <!-- pommel -->
    <circle cx="20" cy="4" r="2"
      fill="#e84020"
      stroke="#1a0e04" stroke-width="1.8"/>
  </symbol>

  <!-- SHIELD: classic heater shield with horizontal accent bar -->
  <symbol id="icon-shield" viewBox="0 0 24 24">
    <!-- shield body -->
    <path
      d="M12 2 L20 5 L20 12 Q20 18 12 22 Q4 18 4 12 L4 5 Z"
      fill="#4090e0"
      stroke="#1a0e04" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- horizontal accent bar across middle -->
    <rect
      x="5.5" y="10.5" width="13" height="3" rx="1"
      fill="#1a6ab0"
      stroke="#1a0e04" stroke-width="1.2"/>
    <!-- highlight sliver at top -->
    <path
      d="M12 4 L18.5 6.5 L18.5 10 L12 10 L5.5 10 L5.5 6.5 Z"
      fill="rgba(180,220,255,0.18)"/>
  </symbol>

  <!-- HEAL: bold plus/cross shape with rounded ends -->
  <symbol id="icon-heal" viewBox="0 0 24 24">
    <!-- vertical bar of cross -->
    <rect
      x="9" y="3" width="6" height="18" rx="3"
      fill="#40c060"
      stroke="#1a0e04" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- horizontal bar of cross -->
    <rect
      x="3" y="9" width="18" height="6" rx="3"
      fill="#40c060"
      stroke="#1a0e04" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- inner overlap fill to unify the cross (no double stroke in center) -->
    <rect x="9" y="9" width="6" height="6" fill="#40c060"/>
  </symbol>

</defs>
</svg>

<div class="demo-panel">

  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-wrap">
        <span class="size-label">32px</span>
        <svg width="32" height="32"><use href="#icon-damage"/></svg>
      </div>
      <div class="icon-wrap">
        <span class="size-label">48px</span>
        <svg width="48" height="48"><use href="#icon-damage"/></svg>
      </div>
    </div>
    <span class="icon-label">Damage</span>
  </div>

  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-wrap">
        <span class="size-label">32px</span>
        <svg width="32" height="32"><use href="#icon-shield"/></svg>
      </div>
      <div class="icon-wrap">
        <span class="size-label">48px</span>
        <svg width="48" height="48"><use href="#icon-shield"/></svg>
      </div>
    </div>
    <span class="icon-label">Shield</span>
  </div>

  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-wrap">
        <span class="size-label">32px</span>
        <svg width="32" height="32"><use href="#icon-heal"/></svg>
      </div>
      <div class="icon-wrap">
        <span class="size-label">48px</span>
        <svg width="48" height="48"><use href="#icon-heal"/></svg>
      </div>
    </div>
    <span class="icon-label">Heal</span>
  </div>

</div>

</body>
</html>
