<!-- card-variant: activation-track-use-v01-c | Use track (one-time): square with inner square, option C — outer square 32×32 (small), inner square at 62% scale (20×20), large center pip 8×8 dark square; three-tier layering; corner-bracket accents; permanently consumed; single action row -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --card-w: 375px;
  --card-h: 525px;
  --card-r: 12.5px;
  --bg-top:      #221004;
  --bg-bot:      #180c02;
  --type-border: #7a4818;
  --type-text:   #c8860c;
  --type-glow:   rgba(160,90,10,0.28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

.card {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--card-r);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 24px 70px rgba(0,0,0,0.97), 0 6px 16px rgba(0,0,0,0.8);
}
.card-fill { position: absolute; inset: 0; z-index: 0; border-radius: var(--card-r); background: #0d0a06; }
.card-image { position: absolute; inset: 0; z-index: 1; }
.card-image > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.grad-top {
  position: absolute;
  left: 12.5px; right: 12.5px; top: 12.5px;
  height: 194px;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 0%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}
.grad-body {
  position: absolute;
  left: 12.5px; right: 12.5px; bottom: 12.5px;
  height: 313px;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 100%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}

.card-frame {
  position: absolute; inset: 0; z-index: 10;
  pointer-events: none;
  border-radius: var(--card-r);
  box-shadow:
    inset 0 0 0 7.5px  #100a04,
    inset 0 0 0 8.75px #3a2410,
    inset 0 0 0 11.25px #100a04,
    inset 0 0 0 12.5px #1e1408;
}
.card-frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.card-header { position: absolute; inset: 0; z-index: 11; pointer-events: none; }
.type-band {
  position: absolute;
  left: 12.5px; right: 12.5px; top: 17.5px;
  height: 35px;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
  border-top:    1.5px solid var(--type-border);
  border-bottom: 1.5px solid var(--type-border);
  box-shadow: 0 5px 20px 0 var(--type-glow), inset 0 1px 0 rgba(255,200,80,0.04);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.type-band::before, .type-band::after { content: ''; display: block; flex: 1; height: 1px; opacity: 0.5; }
.type-band::before { background: linear-gradient(to right, transparent 0%, var(--type-border) 100%); margin-right: 10px; }
.type-band::after  { background: linear-gradient(to left,  transparent 0%, var(--type-border) 100%); margin-left:  10px; }
.type-label {
  color: var(--type-text);
  font-family: 'Cinzel', Georgia, serif;
  font-size: 9px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
  white-space: nowrap; flex-shrink: 0;
  text-shadow: 0 0 12px var(--type-glow);
}

.card-title {
  position: absolute; left: 22.5px; right: 22.5px; top: 65px;
  text-align: center; color: #dcc06a;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2;
  text-shadow: 0 1px 10px rgba(0,0,0,0.95);
}
.title-rule {
  position: absolute; left: 67.5px; right: 67.5px; top: 103px; height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 25%, var(--type-border) 75%, transparent);
  opacity: 0.6;
}

/*
  Option C — Use Track v01
  One consumed marker: outer square 32×32 (small), inner square 20×20 (62% scale).
  A large center pip (8×8) dominates the inner area — three-tier: outer/inner/pip.
  The inner square creates a visible amber ring before the dark pip center.
  Corner brackets (4 small L-shaped amber marks) accent the outer square corners.
  Small, precise, layered — an intricate "seal" look vs A's balance and B's bold fill.
  Permanently consumed — no return path, no cooldown slots.
  Single action row. mech-frame height: 95px — tighter for the smaller marker.
*/
.mech-frame {
  position: absolute;
  left: 22.5px; right: 22.5px;
  bottom: 22.5px;
  height: 95px;
  z-index: 12;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent 0%, rgba(122,72,24,.25) 10%, rgba(122,72,24,.25) 90%, transparent 100%);
}
.mech-rule {
  position: absolute;
  left: 17.5px; right: 17.5px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 18%, var(--type-border) 82%, transparent);
  opacity: 0.55;
}
.mech-rule-top { top: 0; }
.mech-rule-bot { bottom: 0; }

.mech-sections {
  position: absolute;
  top: 1px; bottom: 1px; left: 0; right: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sec {
  width: 100%;
  flex-shrink: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}
.sec::before, .sec::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  opacity: 0.7;
}
.sec::before { top: 0; }
.sec::after  { bottom: 0; }

/* actions — red */
.sec-actions { flex: 1; background: rgba(232,80,48,0.15); }
.sec-actions::before, .sec-actions::after {
  background: linear-gradient(to right, transparent, #e85030 18%, #e85030 82%, transparent);
}

.effect-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  flex: 1;
}

/* Leading track slot — standard 52px, fits 36px rendered marker with breathing room */
.effect-lead {
  flex-shrink: 0;
  width: 52px;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
}

.effect-text {
  flex: 1;
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: rgba(220,200,160,0.82);
  line-height: 1.3;
  align-self: center;
}

.sym-group {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  vertical-align: middle;
}
.sym-mod {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 14px;
  font-weight: 600;
  color: rgba(220,200,160,0.92);
  line-height: 1;
}
</style>

  <!--
    Option C — Use Track v01
    ══════════════════════════════════════════════════
    Consumed marker (§8): square with inner square — activation marker rotated 45°.
    Variant C: SMALL outer square, LAYERED three-tier design, corner bracket accents.

    Variant C specifics:
      • Outer square: 32×32 px (centered in 44×44 viewBox with 6px margin)
      • Inner square: 20×20 px at 62% scale — centered at (22,22) → x=12, y=12
        — amber fill creates a visible ring between outer dark and inner pip
      • Center pip: 8×8 px dark square (40% of inner square) — large, prominent dark center
        — three visible tiers: dark outer → amber ring → dark pip
      • Corner bracket accents: 4 short amber L-brackets at each outer square corner
        — 2-px wide, 5px long legs, stroke only — filigree accent treatment
      • Rendered at 36×36 — smaller than A (40px) and much smaller than B (48px)
      • Lead column: 52px (standard)

    Three-tier layering (dark → amber → dark) creates a "seal impression" look.
    Corner brackets add precision/craft reading. Small size = delicate, controlled.
    Visually distinct: smaller, layered, decorated vs A's plain balance and B's bold mass.
  -->
  <symbol id="track-use-c-marker" viewBox="0 0 44 44">
    <!-- Outer square body: 32×32 centered at (22,22), dark fill -->
    <rect x="6" y="6" width="32" height="32"
          fill="#1a0e04" stroke="none"/>
    <!-- Inner square: 20×20 at 62% scale, centered at (22,22), amber fill -->
    <rect x="12" y="12" width="20" height="20"
          fill="#d4b87a" stroke="none"/>
    <!-- Center pip: 8×8 dark square centered at (22,22) — creates third tier -->
    <rect x="18" y="18" width="8" height="8"
          fill="#1a0e04" stroke="none"/>
    <!--
      Corner bracket accents: 4 L-shaped amber marks at corners of outer square.
      Each bracket: two 5px legs meeting at the corner.
      Corners of outer square at: (6,6), (38,6), (6,38), (38,38).
      Stroke #d4b87a, width 1.5, no fill.
    -->
    <!-- Top-left corner bracket -->
    <polyline points="6,11 6,6 11,6"
              fill="none" stroke="#d4b87a" stroke-width="1.5" stroke-linecap="square"/>
    <!-- Top-right corner bracket -->
    <polyline points="33,6 38,6 38,11"

    <!-- Bottom-left corner bracket -->

    <!-- Bottom-right corner bracket -->
