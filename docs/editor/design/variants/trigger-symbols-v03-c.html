<!-- card-variant: trigger-symbols-v03-c | Trigger symbols v03 option C: pictographic/silhouette approach — each symbol is a bold dark silhouette of a recognizable concept-object; amber detail is a single precise interior mark (keyhole cutout or inner glyph); all 6 shown in use on a Persona card -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --card-w: 375px;
  --card-h: 525px;
  --card-r: 12.5px;
  --bg-top:      #221004;
  --bg-bot:      #180c02;
  --type-border: #7a4818;
  --type-text:   #c8860c;
  --type-glow:   rgba(160,90,10,0.28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; justify-content: center; align-items: flex-start; }

.card {
  position: relative;
  width: var(--card-w); height: var(--card-h);
  border-radius: var(--card-r); overflow: hidden; flex-shrink: 0;
  box-shadow: 0 24px 70px rgba(0,0,0,0.97), 0 6px 16px rgba(0,0,0,0.8);
}
.card-fill { position: absolute; inset: 0; z-index: 0; border-radius: var(--card-r); background: #0d0a06; }
.card-image { position: absolute; inset: 0; z-index: 1; }
.card-image > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.grad-top {
  position: absolute; left: 12.5px; right: 12.5px; top: 12.5px;
  height: 194px; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 0%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}
.grad-body {
  position: absolute; left: 12.5px; right: 12.5px; bottom: 12.5px;
  height: 313px; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 100%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}

.card-frame {
  position: absolute; inset: 0; z-index: 10; pointer-events: none;
  border-radius: var(--card-r);
  box-shadow:
    inset 0 0 0 7.5px  #100a04,
    inset 0 0 0 8.75px #3a2410,
    inset 0 0 0 11.25px #100a04,
    inset 0 0 0 12.5px #1e1408;
}
.card-frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.card-header { position: absolute; inset: 0; z-index: 11; pointer-events: none; }
.type-band {
  position: absolute; left: 12.5px; right: 12.5px; top: 17.5px;
  height: 35px;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
  border-top: 1.5px solid var(--type-border);
  border-bottom: 1.5px solid var(--type-border);
  box-shadow: 0 5px 20px 0 var(--type-glow), inset 0 1px 0 rgba(255,200,80,0.04);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.type-band::before, .type-band::after { content: ''; display: block; flex: 1; height: 1px; opacity: 0.5; }
.type-band::before { background: linear-gradient(to right, transparent 0%, var(--type-border) 100%); margin-right: 10px; }
.type-band::after  { background: linear-gradient(to left,  transparent 0%, var(--type-border) 100%); margin-left:  10px; }
.type-label {
  color: var(--type-text); font-family: 'Cinzel', Georgia, serif;
  font-size: 9px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
  white-space: nowrap; flex-shrink: 0; text-shadow: 0 0 12px var(--type-glow);
}

.card-title {
  position: absolute; left: 22.5px; right: 22.5px; top: 65px;
  text-align: center; color: #dcc06a; font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2;
  text-shadow: 0 1px 10px rgba(0,0,0,0.95);
}
.title-rule {
  position: absolute; left: 67.5px; right: 67.5px; top: 103px; height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 25%, var(--type-border) 75%, transparent);
  opacity: 0.6;
}

.mech-frame {
  position: absolute; left: 22.5px; right: 22.5px; bottom: 22.5px;
  height: 262px; z-index: 12; pointer-events: none;
  background: linear-gradient(to bottom, transparent 0%, rgba(122,72,24,.25) 10%, rgba(122,72,24,.25) 90%, transparent 100%);
}
.mech-rule {
  position: absolute; left: 17.5px; right: 17.5px; height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 18%, var(--type-border) 82%, transparent);
  opacity: 0.55;
}
.mech-rule-top { top: 0; }
.mech-rule-bot { bottom: 0; }

.mech-sections {
  position: absolute; top: 1px; bottom: 1px; left: 0; right: 0;
  display: flex; flex-direction: column; overflow: hidden;
}
.sec {
  width: 100%; flex-shrink: 0; position: relative;
  display: flex; flex-direction: column;
}
.sec::before, .sec::after {
  content: ''; position: absolute; left: 0; right: 0; height: 1px; opacity: 0.7;
}
.sec::before { top: 0; }
.sec::after  { bottom: 0; }

.sec-passive { height: 38px; background: rgba(48,120,240,0.15); }
.sec-passive::before, .sec-passive::after {
  background: linear-gradient(to right, transparent, #3078f0 18%, #3078f0 82%, transparent);
}
.sec-trigger-entry { height: 76px; background: rgba(240,200,48,0.15); }
.sec-trigger-entry::before, .sec-trigger-entry::after {
  background: linear-gradient(to right, transparent, #f0c830 18%, #f0c830 82%, transparent);
}
.sec-actions { height: 48px; background: rgba(232,80,48,0.15); }
.sec-actions::before, .sec-actions::after {
  background: linear-gradient(to right, transparent, #e85030 18%, #e85030 82%, transparent);
}
.sec-trigger-exit { height: 96px; background: rgba(240,200,48,0.15); }
.sec-trigger-exit::before, .sec-trigger-exit::after {
  background: linear-gradient(to right, transparent, #f0c830 18%, #f0c830 82%, transparent);
}

.effect-row {
  flex: 1; display: flex; align-items: center; gap: 7px; padding: 0 12px; min-height: 0;
}
.effect-lead { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
.effect-row-passive { padding-left: 39px; }
.effect-text {
  flex: 1; font-family: 'Crimson Text', Georgia, serif;
  font-size: 13px; font-style: normal; font-weight: 400;
  color: rgba(220,200,160,0.82); line-height: 1.15;
}
.sym-group { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }
.sym-mod {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 14px; font-weight: 600; font-style: normal;
  color: rgba(220,200,160,0.92); line-height: 1;
}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="corner-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feComposite in="blur" operator="over"/>
  </filter>

  <symbol id="frame-d" viewBox="0 0 300 420" overflow="visible">
    <rect x="14" y="14" width="272" height="392" rx="4" fill="none" stroke="#3a2410" stroke-width="0.65" opacity="0.75"/>
    <polygon points="3,3 15,32 32,15"  fill="#7a5030" opacity="0.12" filter="url(#corner-glow)"/>
    <polygon points="5,5 14,30 30,14"  fill="#5a3820" opacity="0.22"/>
    <polygon points="7,7 14,27 27,14"  fill="#3e2c1a" opacity="0.9"/>
    <polygon points="9,9 14,21 21,14"  fill="#6a4828" opacity="0.45"/>
    <polygon points="297,3 285,32 268,15"  fill="#7a5030" opacity="0.12" filter="url(#corner-glow)"/>
    <polygon points="295,5 286,30 270,14"  fill="#5a3820" opacity="0.22"/>
    <polygon points="293,7 286,27 273,14"  fill="#3e2c1a" opacity="0.9"/>
    <polygon points="291,9 286,21 279,14"  fill="#6a4828" opacity="0.45"/>
    <polygon points="3,417 32,405 15,388"  fill="#7a5030" opacity="0.12" filter="url(#corner-glow)"/>
    <polygon points="5,415 30,406 14,390"  fill="#5a3820" opacity="0.22"/>
    <polygon points="7,413 27,406 14,393"  fill="#3e2c1a" opacity="0.9"/>
    <polygon points="9,411 21,406 14,399"  fill="#6a4828" opacity="0.45"/>
    <polygon points="297,417 268,405 285,388"  fill="#7a5030" opacity="0.12" filter="url(#corner-glow)"/>
    <polygon points="295,415 270,406 286,390"  fill="#5a3820" opacity="0.22"/>
    <polygon points="293,413 273,406 286,393"  fill="#3e2c1a" opacity="0.9"/>
    <polygon points="291,411 279,406 286,399"  fill="#6a4828" opacity="0.45"/>
    <polygon points="150,7 157,14 143,14"     fill="#3e2c1a" opacity="0.85"/>
    <polygon points="150,9 155,14 145,14"     fill="#6a4828" opacity="0.4"/>
    <polygon points="150,413 143,406 157,406"  fill="#3e2c1a" opacity="0.85"/>
    <polygon points="150,411 145,406 155,406"  fill="#6a4828" opacity="0.4"/>
    <polygon points="7,210 14,203 14,217"     fill="#3e2c1a" opacity="0.85"/>
    <polygon points="9,210 14,205 14,215"     fill="#6a4828" opacity="0.4"/>
    <polygon points="293,210 286,217 286,203"  fill="#3e2c1a" opacity="0.85"/>
    <polygon points="291,210 286,215 286,205"  fill="#6a4828" opacity="0.4"/>
    <line x1="42"  y1="14"  x2="126" y2="14"  stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="174" y1="14"  x2="258" y2="14"  stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="42"  y1="406" x2="126" y2="406" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="174" y1="406" x2="258" y2="406" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="14"  y1="46"  x2="14"  y2="186" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="14"  y1="234" x2="14"  y2="374" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="286" y1="46"  x2="286" y2="186" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="286" y1="234" x2="286" y2="374" stroke="#281806" stroke-width="0.8" stroke-dasharray="5,4"/>
  </symbol>

  <symbol id="art-d" viewBox="0 0 300 420">
    <defs>
      <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0a0818"/>
        <stop offset="40%"  stop-color="#161028"/>
        <stop offset="100%" stop-color="#080a08"/>
      </linearGradient>
      <radialGradient id="c-glow" cx="50%" cy="42%" r="32%">
        <stop offset="0%"   stop-color="#d8a050" stop-opacity="0.40"/>
        <stop offset="60%"  stop-color="#603018" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <radialGradient id="c-vig" cx="50%" cy="50%" r="62%">
        <stop offset="30%" stop-color="transparent"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
      </radialGradient>
    </defs>
    <rect width="300" height="420" fill="url(#c-sky)"/>
    <rect width="300" height="420" fill="url(#c-glow)"/>
    <ellipse cx="150" cy="280" rx="220" ry="40" fill="#0a0a08" opacity="0.85"/>
    <path d="M 0 230 L 30 200 L 50 220 L 80 180 L 110 215 L 140 195 L 170 220 L 200 185 L 230 215 L 260 200 L 300 230 L 300 420 L 0 420 Z" fill="#0c0808" opacity="0.92"/>
    <rect width="300" height="420" fill="url(#c-vig)"/>
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path d="M12 2 L20 5 L20 12 Q20 19 12 22 Q4 19 4 12 L4 5 Z"
          fill="#4090e0" stroke="#205098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-damage" viewBox="0 0 24 24">
    <polygon points="12,2 13.4,8.2 17.8,4.5 15.6,10.3 22,10.8 16.9,14.2 19.6,20.1 13.2,17 12,23 10.5,17.1 4.2,20.5 6.7,14.4 1,11.2 7.5,10.2 5,4.8 10.7,8.1"
             fill="#f0c030" stroke="#a08000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-heal" viewBox="0 0 24 24">
    <path d="M12 21 C9 18 3 14 3 9 C3 6 5.5 4 8 5 C10 5.8 11 7.5 12 9 C13 7.5 14 5.8 16 5 C18.5 4 21 6 21 9 C21 14 15 18 12 21 Z"
          fill="#e84020" stroke="#901808" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-reveal-character" viewBox="0 0 24 24">
    <rect x="6" y="5" width="13" height="16" rx="1.5" fill="#a89e18" stroke="#807800" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="2" y="2" width="13" height="16" rx="1.5" fill="#d4cc30" stroke="#807800" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="8.5" cy="7.5" r="1.8" fill="#1a0e04"/>
    <path d="M5.5 14.5 Q5.5 11 8.5 11 Q11.5 11 11.5 14.5" fill="#1a0e04" stroke="none"/>
  </symbol>

  <!--
    §7 Trigger Symbols — v03-c: PICTOGRAPHIC / SILHOUETTE + AMBER CUTOUT
    ═════════════════════════════════════════════════════════════════════
    Concept: each symbol is the solid dark silhouette of a recognizable object
    associated with the trigger concept. Amber appears as a single precise
    interior detail — either a cutout through the dark body or an inset mark.
    Shapes are clearly distinct from A (pure polygon/angular) and B (rounded/pill forms).
    Body: #1a0e04 (dark)   Detail: #d4b87a (amber)
    ViewBox: 0 0 24 24     Rendered: 20×20

    trig-reveal      — On Reveal       — dark eye silhouette (almond) with amber iris circle cutout — the act of seeing/revealing
    trig-enter       — On Enter        — dark house/door silhouette (arch + step) with amber threshold line at door opening
    trig-leave       — On Leave        — dark boot/footprint silhouette (stepping away), amber motion line
    trig-char-phase  — Character Phase — dark person/figure silhouette (head + shoulders) with amber diamond at chest center
    trig-complete    — On Complete     — dark ribbon/seal silhouette (scroll tied with ribbon) with amber bold V mark
    trig-flow-marker — On Flow Marker  — dark track/rail silhouette (three horizontal parallel lines) with amber advancing dot on top rail
  -->

  <!-- On Reveal — eye almond silhouette with amber iris
       The eye = seeing/revealing. One bold filled almond, amber iris cutout inside. -->
  <symbol id="trig-reveal" viewBox="0 0 24 24">
    <!-- Dark eye almond (pointed at left and right) -->
    <path d="M2 12 Q7 4 12 4 Q17 4 22 12 Q17 20 12 20 Q7 20 2 12 Z"
          fill="#1a0e04" stroke="none"/>
    <!-- Amber iris circle cutout -->
    <circle cx="12" cy="12" r="4" fill="#d4b87a" stroke="none"/>
    <!-- Dark pupil on top of amber iris -->
    <circle cx="12" cy="12" r="2" fill="#1a0e04" stroke="none"/>
  </symbol>

  <!-- On Enter — doorway silhouette (flat-top rectangle with arch opening at base) with amber threshold bar
       Door/threshold shape = entering. Amber bar marks the moment of crossing over. -->
  <symbol id="trig-enter" viewBox="0 0 24 24">
    <!-- Dark door frame outer rectangle -->
    <rect x="3" y="4" width="18" height="17" rx="1" fill="#1a0e04" stroke="none"/>
    <!-- Amber doorway opening cutout (inner rectangle taller than wide — the passage) -->
    <rect x="7" y="9" width="10" height="12" rx="1" fill="#d4b87a" stroke="none"/>
    <!-- Dark floor/step at bottom of door opening — threshold element -->
    <rect x="7" y="18" width="10" height="3" fill="#1a0e04" stroke="none"/>
    <!-- Amber threshold line at crossing point -->
    <rect x="7" y="17.5" width="10" height="1" fill="#d4b87a" stroke="none"/>
    <!-- Dark inner door details: doorknob on right side of amber opening -->
    <circle cx="15.5" cy="14" r="1" fill="#1a0e04" stroke="none"/>
  </symbol>

  <!-- On Leave — footprint silhouette (angled foot shape, heel at bottom right, toes at top left)
       A single foot stepping away. Amber motion/speed line behind the foot. -->
  <symbol id="trig-leave" viewBox="0 0 24 24">
    <!-- Dark foot/boot silhouette (simplified) — main body -->
    <path d="M7 20 Q4 20 4 17 L4 7 Q4 4 7 4 L10 4 Q12 4 13 6 L14 9 L17 9 Q20 9 20 12 Q20 15 17 15 L13 15 L13 20 Z"
          fill="#1a0e04" stroke="none"/>
    <!-- Amber speed/motion line behind foot -->
    <line x1="3" y1="17" x2="1" y2="17" stroke="#d4b87a" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="13" x2="1" y2="13" stroke="#d4b87a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="10" x2="2" y2="10" stroke="#d4b87a" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- Character Phase — figure silhouette (person: circle head + shoulder arc body)
       The person = character. Amber small diamond at chest center = the active marker. -->
  <symbol id="trig-char-phase" viewBox="0 0 24 24">
    <!-- Dark figure head circle -->
    <circle cx="12" cy="6.5" r="4" fill="#1a0e04" stroke="none"/>
    <!-- Dark figure body (broad shoulder arc to hip trapezoid) -->
    <path d="M4 22 Q4 14 12 13 Q20 14 20 22 Z"
          fill="#1a0e04" stroke="none"/>
    <!-- Amber diamond at chest center — the active marker / phase indicator -->
    <polygon points="12,14.5 14,16.5 12,18.5 10,16.5" fill="#d4b87a" stroke="none"/>
  </symbol>

  <!-- On Complete — scroll/ribbon silhouette (rolled document tied with ribbon at center)
       A bound scroll = a completed task/quest. Amber bold V (check) at the center tie. -->
  <symbol id="trig-complete" viewBox="0 0 24 24">
    <!-- Dark scroll body — central rectangle representing unrolled document -->
    <rect x="4" y="5" width="16" height="14" rx="2" fill="#1a0e04" stroke="none"/>
    <!-- Dark rolled ends (ellipses at top and bottom) representing the scroll roll -->
    <ellipse cx="12" cy="5" rx="8" ry="2.5" fill="#1a0e04" stroke="none"/>
    <ellipse cx="12" cy="19" rx="8" ry="2.5" fill="#1a0e04" stroke="none"/>
    <!-- Amber bold checkmark on the scroll body -->
    <path d="M8 12 L11 15.5 L16.5 8.5"
          fill="none" stroke="#d4b87a" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- On Flow Marker — track/rail silhouette (three horizontal bars like a ladder/track segment)
       Three parallel bars = the activation track rail. Amber filled dot = the advancing token. -->
  <symbol id="trig-flow-marker" viewBox="0 0 24 24">
    <!-- Dark rail / track bar 1 (top) -->
    <rect x="2" y="4" width="20" height="4" rx="2" fill="#1a0e04" stroke="none"/>
    <!-- Dark rail / track bar 2 (middle) -->
    <rect x="2" y="10" width="20" height="4" rx="2" fill="#1a0e04" stroke="none"/>
    <!-- Dark rail / track bar 3 (bottom) -->
    <rect x="2" y="16" width="20" height="4" rx="2" fill="#1a0e04" stroke="none"/>
    <!-- Amber advancing dot on top bar (at right side = advanced position) -->
    <circle cx="18" cy="6" r="2.5" fill="#d4b87a" stroke="none"/>
    <!-- Amber smaller echo dot on middle bar (behind, showing movement trail) -->
    <circle cx="13" cy="12" r="1.8" fill="#d4b87a" stroke="none" opacity="0.5"/>
  </symbol>

</defs>
</svg>

<div class="card">
  <div class="card-fill"></div>
  <div class="card-image"><svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg"><use href="#art-d"/></svg></div>
  <div class="grad-top"></div>
  <div class="grad-body"></div>
  <div class="card-frame"><svg xmlns="http://www.w3.org/2000/svg"><use href="#frame-d"/></svg></div>
  <div class="card-header">
    <div class="type-band"><span class="type-label">Persona</span></div>
    <div class="card-title">The Wanderer</div>
    <div class="title-rule"></div>
  </div>

  <div class="mech-frame">
    <div class="mech-rule mech-rule-top"></div>
    <div class="mech-sections">

      <!-- Passive section -->
      <div class="sec sec-passive">
        <div class="effect-row effect-row-passive">
          <span class="effect-text">
            <span class="sym-group"><svg width="16" height="16"><use href="#icon-shield"/></svg><span class="sym-mod">1</span></span>
            Armor while in a Location
          </span>
        </div>
      </div>

      <!-- Trigger-entry: On Reveal + On Enter -->
      <div class="sec sec-trigger-entry">
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="20" height="20"><use href="#trig-reveal"/></svg>
          </div>
          <span class="effect-text">
            Reveal <span class="sym-group"><svg width="16" height="16"><use href="#icon-reveal-character"/></svg><span class="sym-mod">2</span></span> from any deck
          </span>
        </div>
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="20" height="20"><use href="#trig-enter"/></svg>
          </div>
          <span class="effect-text">Draw 1 card when entering a new Location</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="sec sec-actions">
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path d="M12 3 L21 12 L12 21 L3 12 Z"
                    fill="rgba(232,80,48,0.18)" stroke="#e85030" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="effect-text">
            Strike <span class="sym-group"><svg width="16" height="16"><use href="#icon-damage"/></svg><span class="sym-mod">3</span></span> an adjacent enemy
          </span>
        </div>
      </div>

      <!-- Trigger-exit: On Leave, Char Phase, On Complete, On Flow Marker -->
      <div class="sec sec-trigger-exit">
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="20" height="20"><use href="#trig-leave"/></svg>
          </div>
          <span class="effect-text">
            Gain <span class="sym-group"><svg width="16" height="16"><use href="#icon-heal"/></svg><span class="sym-mod">1</span></span> when leaving a hostile Location
          </span>
        </div>
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="20" height="20"><use href="#trig-char-phase"/></svg>
          </div>
          <span class="effect-text">Move 1 space at start of Character Phase</span>
        </div>
        <div class="effect-row">
