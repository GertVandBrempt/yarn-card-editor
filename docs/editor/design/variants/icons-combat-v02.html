<!-- icon-demo: icons-combat-v02 | damage, shield, heal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #12100a; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <symbol id="icon-damage" viewBox="0 0 24 24">
    <path
      d="M12 21 L6 10 L9 9 L8 3 L12 6 L16 3 L15 9 L18 10 Z"
      fill="#e84020"
      stroke="#1a0e04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path
      d="M12 2 L20 5 L20 12 Q20 19 12 22 Q4 19 4 12 L4 5 Z"
      fill="#4090e0"
      stroke="#1a0e04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-heal" viewBox="0 0 24 24">
    <polygon
      points="9,2 15,2 15,9 22,9 22,15 15,15 15,22 9,22 9,15 2,15 2,9 9,9"
      fill="#40c060"
      stroke="#1a0e04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-damage"/></svg>
<svg width="48" height="48"><use href="#icon-shield"/></svg>
<svg width="48" height="48"><use href="#icon-heal"/></svg>

</body>
</html>
