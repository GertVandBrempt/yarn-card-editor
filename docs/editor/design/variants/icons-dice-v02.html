<!-- icon-demo: icons-dice-v02 | die-constitution, die-zeal, die-path -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #12100a; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- DIE-CONSTITUTION: red, heart pip -->
  <symbol id="icon-die-constitution" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="4"
          fill="#e84020" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- heart pip punched out via evenodd -->
    <path fill-rule="evenodd"
          d="M3 3h18v18H3z M12 17 C12 17 7 13.5 7 10.5 C7 8.5 8.5 7 10.5 7 C11.3 7 12 7.6 12 7.6 C12 7.6 12.7 7 13.5 7 C15.5 7 17 8.5 17 10.5 C17 13.5 12 17 12 17 Z"
          fill="#1a0e04" stroke="none"/>
  </symbol>

  <!-- DIE-ZEAL: blue, flame pip -->
  <symbol id="icon-die-zeal" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="4"
          fill="#4090e0" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- flame pip punched out via evenodd -->
    <path fill-rule="evenodd"
          d="M3 3h18v18H3z M12 7 C12 7 15 10 15 13 C15 15.2 13.7 17 12 17 C10.3 17 9 15.2 9 13 C9 10 12 7 12 7 Z"
          fill="#1a0e04" stroke="none"/>
  </symbol>

  <!-- DIE-PATH: green, arrow pip -->
  <symbol id="icon-die-path" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="4"
          fill="#40c060" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- arrow pointing right, punched out via evenodd -->
    <path fill-rule="evenodd"
          d="M3 3h18v18H3z M8 10.5 L14 10.5 L14 8.5 L17 12 L14 15.5 L14 13.5 L8 13.5 Z"
          fill="#1a0e04" stroke="none"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-die-constitution"/></svg>
<svg width="48" height="48"><use href="#icon-die-zeal"/></svg>
<svg width="48" height="48"><use href="#icon-die-path"/></svg>

</body>
</html>
