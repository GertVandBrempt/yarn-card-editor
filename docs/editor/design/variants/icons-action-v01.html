<!-- icon-demo: icons-action-v01 | move, scout, gain-action icons -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #12100a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 32px;
}
.icon-grid {
  display: flex;
  gap: 64px;
  align-items: flex-end;
}
.icon-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.icon-sizes {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}
.icon-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.size-label {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 2px;
  color: #4a3e28;
  text-transform: uppercase;
}
.icon-label {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #7a6840;
  text-transform: uppercase;
  text-align: center;
}
svg.icon-use {
  display: block;
  overflow: visible;
}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- move: bold rightward chevron arrow with a weighted tail -->
  <symbol id="icon-move" viewBox="0 0 24 24">
    <!-- shaft -->
    <rect x="2" y="10.5" width="13" height="3" rx="1.2"
          fill="#d0c8a0" stroke="#1a0e04" stroke-width="1.8"
          stroke-linejoin="round"/>
    <!-- arrowhead -->
    <polygon points="13,5 22,12 13,19"
             fill="#d0c8a0" stroke="#1a0e04" stroke-width="1.8"
             stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- scout: bold eye with four radiating vision lines -->
  <symbol id="icon-scout" viewBox="0 0 24 24">
    <!-- radiating lines — top, bottom, left, right -->
    <line x1="12" y1="2"  x2="12" y2="5"  stroke="#40c8d0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="19" x2="12" y2="22" stroke="#40c8d0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="2"  y1="12" x2="5"  y2="12" stroke="#40c8d0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19" y1="12" x2="22" y2="12" stroke="#40c8d0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- outer eye shape -->
    <path d="M3.5,12 C6,6.5 18,6.5 20.5,12 C18,17.5 6,17.5 3.5,12 Z"
          fill="#40c8d0" stroke="#1a0e04" stroke-width="1.8"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- pupil -->
    <circle cx="12" cy="12" r="3.2"
            fill="#1a0e04" stroke="none"/>
    <!-- catchlight -->
    <circle cx="13.2" cy="10.8" r="1"
            fill="#40c8d0" stroke="none"/>
  </symbol>

  <!-- gain-action: bold upward lightning bolt -->
  <symbol id="icon-gain-action" viewBox="0 0 24 24">
    <!-- bolt shape: two filled polygons fused -->
    <polygon points="13.5,2 7,13.5 12.5,13.5 10.5,22 17,10.5 11.5,10.5"
             fill="#f0c030" stroke="#1a0e04" stroke-width="1.8"
             stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

</defs>
</svg>

<div class="icon-grid">

  <!-- move -->
  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-slot">
        <svg class="icon-use" width="32" height="32">
          <use href="#icon-move" width="32" height="32"/>
        </svg>
        <span class="size-label">32px</span>
      </div>
      <div class="icon-slot">
        <svg class="icon-use" width="48" height="48">
          <use href="#icon-move" width="48" height="48"/>
        </svg>
        <span class="size-label">48px</span>
      </div>
    </div>
    <span class="icon-label">Move</span>
  </div>

  <!-- scout -->
  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-slot">
        <svg class="icon-use" width="32" height="32">
          <use href="#icon-scout" width="32" height="32"/>
        </svg>
        <span class="size-label">32px</span>
      </div>
      <div class="icon-slot">
        <svg class="icon-use" width="48" height="48">
          <use href="#icon-scout" width="48" height="48"/>
        </svg>
        <span class="size-label">48px</span>
      </div>
    </div>
    <span class="icon-label">Scout</span>
  </div>

  <!-- gain-action -->
  <div class="icon-group">
    <div class="icon-sizes">
      <div class="icon-slot">
        <svg class="icon-use" width="32" height="32">
          <use href="#icon-gain-action" width="32" height="32"/>
        </svg>
        <span class="size-label">32px</span>
      </div>
      <div class="icon-slot">
        <svg class="icon-use" width="48" height="48">
          <use href="#icon-gain-action" width="48" height="48"/>
        </svg>
        <span class="size-label">48px</span>
      </div>
    </div>
    <span class="icon-label">Gain Action</span>
  </div>

</div>
</body>
</html>
