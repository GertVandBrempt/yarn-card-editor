<!-- icon-demo: icons-reveal-v01 | reveal-character, reveal-item icons -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #12100a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Cinzel', Georgia, serif;
}
.demo {
  display: flex;
  gap: 64px;
  align-items: flex-end;
  padding: 48px;
}
.icon-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.icon-row {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}
.icon-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.icon-slot svg {
  display: block;
}
.size-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #4a3820;
}
.icon-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #7a5828;
  text-align: center;
  margin-top: 4px;
}
.divider {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, #3a2410 40%, #3a2410 60%, transparent);
  align-self: center;
  margin: 0 8px;
}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- reveal-character: yellow fill, person silhouette -->
  <symbol id="icon-reveal-character" viewBox="0 0 24 24">
    <!-- radiating reveal lines -->
    <line x1="18.5" y1="3.5" x2="20.5" y2="1.5" stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20.5" y1="6"   x2="23"   y2="5"   stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19"   y1="9"   x2="22"   y2="9.5" stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <!-- card body with folded corner -->
    <path d="M4 3 L15 3 L15 5 L17 5 L17 21 L4 21 Z"
          fill="#d4cc30" stroke="#1a0e04" stroke-width="1.8"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- fold triangle at top-right -->
    <path d="M15 3 L17 5 L15 5 Z"
          fill="#a89e18" stroke="#1a0e04" stroke-width="1.2"
          stroke-linejoin="round"/>
    <!-- person silhouette: head -->
    <circle cx="10.5" cy="10" r="2.2"
            fill="#1a0e04" stroke="none"/>
    <!-- person silhouette: body -->
    <path d="M7.5 18 C7.5 14.5 13.5 14.5 13.5 18"
          fill="#1a0e04" stroke="none"/>
  </symbol>

  <!-- reveal-item: teal fill, gem/diamond shape -->
  <symbol id="icon-reveal-item" viewBox="0 0 24 24">
    <!-- radiating reveal lines -->
    <line x1="18.5" y1="3.5" x2="20.5" y2="1.5" stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20.5" y1="6"   x2="23"   y2="5"   stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19"   y1="9"   x2="22"   y2="9.5" stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
    <!-- card body with folded corner -->
    <path d="M4 3 L15 3 L15 5 L17 5 L17 21 L4 21 Z"
          fill="#40a0c0" stroke="#1a0e04" stroke-width="1.8"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- fold triangle at top-right -->
    <path d="M15 3 L17 5 L15 5 Z"
          fill="#2a7090" stroke="#1a0e04" stroke-width="1.2"
          stroke-linejoin="round"/>
    <!-- gem/diamond shape centered in card -->
    <path d="M10.5 9 L13 12 L10.5 17 L8 12 Z"
          fill="#1a0e04" stroke="none"/>
    <line x1="8" y1="12" x2="13" y2="12"
          stroke="#1a0e04" stroke-width="0.8" stroke-linecap="round"/>
  </symbol>

</defs>
</svg>

<div class="demo">

  <!-- reveal-character -->
  <div class="icon-group">
    <div class="icon-row">
      <div class="icon-slot">
        <svg width="32" height="32"><use href="#icon-reveal-character" width="32" height="32"/></svg>
        <span class="size-label">32px</span>
      </div>
      <div class="icon-slot">
        <svg width="48" height="48"><use href="#icon-reveal-character" width="48" height="48"/></svg>
        <span class="size-label">48px</span>
      </div>
    </div>
    <div class="icon-label">Reveal<br>Character</div>
  </div>

  <div class="divider"></div>

  <!-- reveal-item -->
  <div class="icon-group">
    <div class="icon-row">
      <div class="icon-slot">
        <svg width="32" height="32"><use href="#icon-reveal-item" width="32" height="32"/></svg>
        <span class="size-label">32px</span>
      </div>
      <div class="icon-slot">
        <svg width="48" height="48"><use href="#icon-reveal-item" width="48" height="48"/></svg>
        <span class="size-label">48px</span>
      </div>
    </div>
    <div class="icon-label">Reveal<br>Item</div>
  </div>

</div>

</body>
</html>
