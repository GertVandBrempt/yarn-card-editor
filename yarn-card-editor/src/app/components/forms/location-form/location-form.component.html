<div class="location-form card-form">
  <div class="form-group">
    <label>Title</label>
    <input type="text" [ngModel]="local.title" (ngModelChange)="onTitleChange($event)" placeholder="Location name…" />
  </div>

  <div class="form-group">
    <label>Subtitle</label>
    <input type="text" [ngModel]="local.subtitle" (ngModelChange)="onSubtitleChange($event)" placeholder="Secondary label…" />
  </div>

  <div class="form-group">
    <label>Tier</label>
    <select [ngModel]="local.tier" (ngModelChange)="onTierChange($event)">
      <option value="generic">Generic</option>
      <option value="setpiece">Setpiece</option>
    </select>
  </div>

  <div class="form-group">
    <label>Flavour Text</label>
    <textarea [ngModel]="local.flavourText" (ngModelChange)="onFlavourChange($event)" rows="2" placeholder="Italic lore text…"></textarea>
  </div>

  <div class="form-group">
    <label>Card Art</label>
    <app-image-upload [imageUrl]="local.imageUrl" (imageUrlChange)="onImageChange($event)" />
  </div>

  <div class="form-section feature-undesigned">
    <div class="connections-header">
      <span class="section-label">Connections <span class="undesigned-badge" title="Visual design not yet finalised">Not yet designed</span></span>
    </div>
    <div class="connection-grid">
      <div class="form-group">
        <label>North</label>
        <select disabled><option>None</option></select>
      </div>
      <div class="form-group">
        <label>East</label>
        <select disabled><option>None</option></select>
      </div>
      <div class="form-group">
        <label>South</label>
        <select disabled><option>None</option></select>
      </div>
      <div class="form-group">
        <label>West</label>
        <select disabled><option>None</option></select>
      </div>
    </div>
  </div>

  <div class="form-section">
    <app-triggers-editor
      [triggers]="triggers"
      [allowedTriggerTypes]="allowedTriggerTypes"
      (triggersChange)="onTriggersChange($event)"
    />
  </div>

  <div class="form-section">
    <app-actions-editor
      [actions]="local.actions"
      (actionsChange)="onActionsChange($event)"
    />
  </div>
</div>
