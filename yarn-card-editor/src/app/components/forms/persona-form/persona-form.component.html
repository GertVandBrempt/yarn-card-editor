<div class="persona-form card-form">
  <div class="form-group">
    <label>Title</label>
    <input type="text" [ngModel]="local.title" (ngModelChange)="onTitleChange($event)" placeholder="Persona name…" />
  </div>

  <div class="form-group">
    <label>Subtitle</label>
    <input type="text" [ngModel]="local.subtitle" (ngModelChange)="onSubtitleChange($event)" placeholder="Secondary label…" />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Role</label>
      <select [ngModel]="local.role" (ngModelChange)="onRoleChange($event)">
        <option value="constitution">Constitution</option>
        <option value="zeal">Zeal</option>
        <option value="path">Path</option>
      </select>
    </div>

    <div class="form-group">
      <label>Trait</label>
      <input type="text" [ngModel]="local.trait" (ngModelChange)="onTraitChange($event)" placeholder="e.g. Skill, Instinct…" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" [checked]="local.isCore" (change)="onIsCoreChange($any($event.target).checked)" />
        Core Persona (carries persona slots)
      </label>
    </div>

    <div class="form-group">
      <label>Life Point Slots</label>
      <input type="number" min="0" [ngModel]="local.lifePointSlotCount" (ngModelChange)="onLifePointSlotCountChange(+$event)" />
    </div>
  </div>

  <div class="form-group">
    <label>Flavour Text</label>
    <textarea [ngModel]="local.flavourText" (ngModelChange)="onFlavourChange($event)" rows="2" placeholder="Italic lore text…"></textarea>
  </div>

  <div class="form-group">
    <label>Card Art</label>
    <app-image-upload [imageUrl]="local.imageUrl" (imageUrlChange)="onImageChange($event)" />
  </div>

  <!-- No triggers on Persona cards -->

  <div class="form-section">
    <app-actions-editor
      [actions]="local.actions"
      (actionsChange)="onActionsChange($event)"
    />
  </div>
</div>
