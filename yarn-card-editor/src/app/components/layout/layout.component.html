<div class="layout" [class.sidebar-open]="sidebarOpen()">
  <!-- Mobile hamburger overlay backdrop -->
  @if (isMobile() && sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Mobile top bar (hamburger) -->
  @if (isMobile()) {
    <div class="mobile-topbar">
      <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle navigation menu" aria-expanded="{{ sidebarOpen() }}">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      @if (activeSet()) {
        <span class="mobile-set-title">{{ activeSet()!.name }}</span>
      }
    </div>
  }

  <aside class="sidebar" [class.sidebar-visible]="!isMobile() || sidebarOpen()">
    <div class="sidebar-header">
      <button class="back-btn" (click)="backToSets()">← Sets</button>
      @if (activeSet()) {
        <h2 class="set-title">{{ activeSet()!.name }}</h2>
      }
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn" (click)="navigateToList()">All Cards</button>

      <div class="nav-section-label">New Card</div>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('persona')">Persona</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('location')">Location</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('character')">Character</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('item')">Item</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('event')">Event</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('main-quest')">Main Quest</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('side-quest')">Side Quest</button>
      <button class="nav-btn new-card-btn" (click)="navigateToNewCard('script')">Script</button>
    </nav>
  </aside>

  <main class="main-content" [class.has-mobile-topbar]="isMobile()">
    <router-outlet />
  </main>
</div>
