<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yarn — Card Review</title>
  <style>
    :root {
      --gold: #c8a45a;
      --bg: #12111a;
      --surface: #1c1b28;
      --surface2: #221f33;
      --border: #2e2c42;
      --text: #ddd;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      padding: 28px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { color: var(--gold); font-size: 1.4rem; letter-spacing: 0.06em; font-weight: 600; }
    .updated { color: var(--muted); font-size: 0.75rem; margin-top: 6px; }
    .updated strong { color: #aaa; }

    /* Type filter chips */
    .filters {
      display: flex; gap: 8px; padding: 14px 16px;
      flex-wrap: wrap; justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .chip {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); padding: 4px 14px;
      border-radius: 20px; font-size: 0.72rem;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .chip.active, .chip:hover { border-color: var(--gold); color: var(--gold); }

    /* Card list */
    .card-list {
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      max-width: 560px; margin: 0 auto;
    }
    .card-entry {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .card-entry-top {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px 8px;
    }
    .type-badge {
      font-size: 0.62rem; font-weight: 700;
      padding: 3px 9px; border-radius: 10px;
      background: #1e1c30; color: var(--gold);
      border: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: 0.1em;
      flex-shrink: 0;
    }
    .variant-id { font-size: 0.85rem; color: #ccc; font-weight: 600; }
    .variant-version { font-size: 0.75rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }
    .card-desc {
      font-size: 0.77rem; color: var(--muted);
      padding: 0 14px 12px; line-height: 1.4;
    }
    .card-actions {
      display: flex; border-top: 1px solid var(--border);
    }
    .card-actions a {
      flex: 1; text-align: center;
      padding: 10px 8px; font-size: 0.78rem;
      color: var(--gold); text-decoration: none;
      border-right: 1px solid var(--border);
      transition: background 0.1s;
    }
    .card-actions a:last-child { border-right: none; }
    .card-actions a:active, .card-actions a:hover { background: var(--surface2); }

    /* Empty state */
    .empty {
      text-align: center; color: #444;
      padding: 60px 20px; font-size: 0.9rem; line-height: 1.6;
    }
    .empty strong { color: #666; display: block; margin-bottom: 8px; font-size: 1.1rem; }
  </style>
</head>
<body>

<header>
  <h1>🧵 Yarn &mdash; Card Review</h1>
  <p class="updated">Updated: <strong>pending first orchestrator run</strong></p>
</header>

<div class="filters">
  <span class="chip active" onclick="filter('all')">All</span>
  <span class="chip" onclick="filter('location')">Location</span>
  <span class="chip" onclick="filter('character')">Character</span>
  <span class="chip" onclick="filter('item')">Item</span>
  <span class="chip" onclick="filter('event')">Event</span>
  <span class="chip" onclick="filter('quest')">Quest</span>
  <span class="chip" onclick="filter('persona')">Persona</span>
  <span class="chip" onclick="filter('script')">Script</span>
</div>

<div class="card-list" id="card-list">
  <div class="empty">
    <strong>No variants yet</strong>
    The orchestrator will populate this gallery<br>after the first card design run.
  </div>
</div>

<script>
  function filter(type) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.card-entry').forEach(el => {
      el.style.display = (type === 'all' || el.dataset.type === type) ? '' : 'none';
    });
  }
</script>

</body>
</html>
