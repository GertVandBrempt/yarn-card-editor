name: Deploy Editor to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'yarn-card-editor/**'
      - 'design/card-index.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yarn-card-editor/package-lock.json

      - name: Install dependencies
        run: cd yarn-card-editor && npm install

      - name: Build Angular app
        run: cd yarn-card-editor && npx ng build --base-href /yarn-card-editor/editor/

      - name: Commit and push built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/editor/ docs/review/ docs/.nojekyll
          git diff --cached --quiet || git commit -m "[skip ci] Deploy editor"
          git push
