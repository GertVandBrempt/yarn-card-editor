<!-- icon-reference | accepted icon set for Yarn card design -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #ffffff; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- COMBAT -->
  <symbol id="icon-damage" viewBox="0 0 24 24">
    <polygon
      points="12,2 13.4,8.2 17.8,4.5 15.6,10.3 22,10.8 16.9,14.2 19.6,20.1 13.2,17 12,23 10.5,17.1 4.2,20.5 6.7,14.4 1,11.2 7.5,10.2 5,4.8 10.7,8.1"
      fill="#f0c030"
      stroke="#a08000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path
      d="M12 2 L20 5 L20 12 Q20 19 12 22 Q4 19 4 12 L4 5 Z"
      fill="#4090e0"
      stroke="#205098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-heal" viewBox="0 0 24 24">
    <path
      d="M12,21.5 C12,21.5 2,14 2,8 C2,4.5 4.5,2 7.5,2 C9.5,2 11,3 12,4.5 C13,3 14.5,2 16.5,2 C19.5,2 22,4.5 22,8 C22,14 12,21.5 12,21.5 Z"
      fill="#e84020"
      stroke="#901808" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ACTIONS -->
  <symbol id="icon-scout" viewBox="0 0 24 24">
    <path d="M2,12 C5,6 19,6 22,12 C19,18 5,18 2,12 Z M12,12 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0"
          fill="#40c8d0" fill-rule="evenodd" stroke="#207880" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3" fill="#1a0e04"/>
  </symbol>

  <symbol id="icon-gain-action" viewBox="0 0 24 24">
    <polygon points="14,2 8,13 13,13 10,22 16,11 11,11"
             fill="#f0c030" stroke="#b08000" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- REVEAL -->
  <symbol id="icon-reveal-character" viewBox="0 0 24 24">
    <rect x="6" y="5" width="13" height="16" rx="1.5"
          fill="#a89e18" stroke="#807800" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="2" y="2" width="13" height="16" rx="1.5"
          fill="#d4cc30" stroke="#807800" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="8.5" cy="7.5" r="1.8" fill="#1a0e04"/>
    <path d="M5.5 14.5 Q5.5 11 8.5 11 Q11.5 11 11.5 14.5"
          fill="#1a0e04" stroke="none"/>
  </symbol>

  <symbol id="icon-reveal-item" viewBox="0 0 24 24">
    <rect x="6" y="5" width="13" height="16" rx="1.5"
          fill="#206070" stroke="#186080" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="2" y="2" width="13" height="16" rx="1.5"
          fill="#40a0c0" stroke="#186080" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="8.5,6.5 11,10 8.5,14 6,10"
             fill="#1a0e04" stroke="none"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-damage"/></svg>
<svg width="48" height="48"><use href="#icon-shield"/></svg>
<svg width="48" height="48"><use href="#icon-heal"/></svg>
<svg width="48" height="48"><use href="#icon-scout"/></svg>
<svg width="48" height="48"><use href="#icon-gain-action"/></svg>
<svg width="48" height="48"><use href="#icon-reveal-character"/></svg>
<svg width="48" height="48"><use href="#icon-reveal-item"/></svg>

</body>
</html>
