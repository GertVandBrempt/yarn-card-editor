<!-- icon-demo: icons-action-v03 | move (boot), scout (eye+iris), gain-action (lightning) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; display: flex; gap: 16px; padding: 16px; background: #ffffff; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<defs>

  <symbol id="icon-move" viewBox="0 0 24 24">
    <!-- side-profile boot: flat sole, low heel, toe pointing right -->
    <path d="M3,18 L3,14 C3,14 3,12 5,12 L10,12 L10,9 C10,9 10,7 12,7 L14,7 C15,7 16,8 16,9 L16,12 L18,12 C20,12 21,13 21,14 L21,16 C21,17 20,18 19,18 Z"
          fill="#d0c8a0" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-scout" viewBox="0 0 24 24">
    <path d="M2,12 C5,6 19,6 22,12 C19,18 5,18 2,12 Z M12,12 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0"
          fill="#40c8d0" fill-rule="evenodd" stroke="#1a0e04" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3" fill="#1a0e04"/>
  </symbol>

  <symbol id="icon-gain-action" viewBox="0 0 24 24">
    <polygon points="14,2 8,13 13,13 10,22 16,11 11,11"
             fill="#f0c030" stroke="#1a0e04" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

</defs>
</svg>

<svg width="48" height="48"><use href="#icon-move"/></svg>
<svg width="48" height="48"><use href="#icon-scout"/></svg>
<svg width="48" height="48"><use href="#icon-gain-action"/></svg>

</body>
</html>
