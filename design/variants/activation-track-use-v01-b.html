<!-- card-variant: activation-track-use-v01-b | Use track (one-time): square with inner square, option B — outer square 44×44, inner square at 70% scale (31×31), no center pip; wide amber fill, thin dark border ring; large heavy marker; permanently consumed; single action row -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --card-w: 375px;
  --card-h: 525px;
  --card-r: 12.5px;
  --bg-top:      #221004;
  --bg-bot:      #180c02;
  --type-border: #7a4818;
  --type-text:   #c8860c;
  --type-glow:   rgba(160,90,10,0.28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

.card {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--card-r);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 24px 70px rgba(0,0,0,0.97), 0 6px 16px rgba(0,0,0,0.8);
}
.card-fill { position: absolute; inset: 0; z-index: 0; border-radius: var(--card-r); background: #0d0a06; }
.card-image { position: absolute; inset: 0; z-index: 1; }
.card-image > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.grad-top {
  position: absolute;
  left: 12.5px; right: 12.5px; top: 12.5px;
  height: 194px;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 0%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}
.grad-body {
  position: absolute;
  left: 12.5px; right: 12.5px; bottom: 12.5px;
  height: 313px;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse 90% 100% at 50% 100%, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 70%, transparent 100%);
}

.card-frame {
  position: absolute; inset: 0; z-index: 10;
  pointer-events: none;
  border-radius: var(--card-r);
  box-shadow:
    inset 0 0 0 7.5px  #100a04,
    inset 0 0 0 8.75px #3a2410,
    inset 0 0 0 11.25px #100a04,
    inset 0 0 0 12.5px #1e1408;
}
.card-frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.card-header { position: absolute; inset: 0; z-index: 11; pointer-events: none; }
.type-band {
  position: absolute;
  left: 12.5px; right: 12.5px; top: 17.5px;
  height: 35px;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
  border-top:    1.5px solid var(--type-border);
  border-bottom: 1.5px solid var(--type-border);
  box-shadow: 0 5px 20px 0 var(--type-glow), inset 0 1px 0 rgba(255,200,80,0.04);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.type-band::before, .type-band::after { content: ''; display: block; flex: 1; height: 1px; opacity: 0.5; }
.type-band::before { background: linear-gradient(to right, transparent 0%, var(--type-border) 100%); margin-right: 10px; }
.type-band::after  { background: linear-gradient(to left,  transparent 0%, var(--type-border) 100%); margin-left:  10px; }
.type-label {
  color: var(--type-text);
  font-family: 'Cinzel', Georgia, serif;
  font-size: 9px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
  white-space: nowrap; flex-shrink: 0;
  text-shadow: 0 0 12px var(--type-glow);
}

.card-title {
  position: absolute; left: 22.5px; right: 22.5px; top: 65px;
  text-align: center; color: #dcc06a;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 26px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2;
  text-shadow: 0 1px 10px rgba(0,0,0,0.95);
}
.title-rule {
  position: absolute; left: 67.5px; right: 67.5px; top: 103px; height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 25%, var(--type-border) 75%, transparent);
  opacity: 0.6;
}

/*
  Option B — Use Track v01
  One consumed marker: outer square 44×44, inner square 31×31 (70% scale).
  Large, bold marker — wide amber fill area surrounded by a dark 6.5px border ring.
  No center pip — the amber fill IS the focal element.
  A "wide-window" look: mostly amber with a dark frame, immediately distinct from option A.
  Permanently consumed — no return path, no cooldown slots.
  Single action row. mech-frame height: 110px — slightly taller for the larger marker.
*/
.mech-frame {
  position: absolute;
  left: 22.5px; right: 22.5px;
  bottom: 22.5px;
  height: 110px;
  z-index: 12;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent 0%, rgba(122,72,24,.25) 10%, rgba(122,72,24,.25) 90%, transparent 100%);
}
.mech-rule {
  position: absolute;
  left: 17.5px; right: 17.5px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--type-border) 18%, var(--type-border) 82%, transparent);
  opacity: 0.55;
}
.mech-rule-top { top: 0; }
.mech-rule-bot { bottom: 0; }

.mech-sections {
  position: absolute;
  top: 1px; bottom: 1px; left: 0; right: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sec {
  width: 100%;
  flex-shrink: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}
.sec::before, .sec::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  opacity: 0.7;
}
.sec::before { top: 0; }
.sec::after  { bottom: 0; }

/* actions — red */
.sec-actions { flex: 1; background: rgba(232,80,48,0.15); }
.sec-actions::before, .sec-actions::after {
  background: linear-gradient(to right, transparent, #e85030 18%, #e85030 82%, transparent);
}

.effect-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  flex: 1;
}

/* Leading track slot — wider at 58px to comfortably hold 48px rendered marker */
.effect-lead {
  flex-shrink: 0;
  width: 58px;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
}

.effect-text {
  flex: 1;
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: rgba(220,200,160,0.82);
  line-height: 1.3;
  align-self: center;
}

.sym-group {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  vertical-align: middle;
}
.sym-mod {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 14px;
  font-weight: 600;
  color: rgba(220,200,160,0.92);
  line-height: 1;
}
</style>

  <!--
    Option B — Use Track v01
    ══════════════════════════════════════════════════
    Consumed marker (§8): square with inner square.
    Variant B: LARGE outer square, WIDE inner square — majority amber fill.
    The marker reads as "mostly amber" — a bold, filled presence.

    Variant B specifics:
      • Outer square: 44×44 px (4px margin → x=4,y=4 in 52×52 viewBox)
      • Inner square: 31×31 px at 70% scale — centered at (26,26) → x=10.5, y=10.5
      • No center pip — inner fill is the focal element
      • Outer body: dark #1a0e04 (thin 6.5px ring on each side)
      • Inner fill: amber #d4b87a, full opacity
      • Rendered at 48×48 — larger than option A's 40×40
      • Lead column: 58px wide

    Visually distinct from A: larger outer, much wider amber fill proportion,
    no pip, rendered bigger. Reads as "substantial mass of amber."
  -->
  <symbol id="track-use-b-marker" viewBox="0 0 52 52">
    <!-- Outer square: 44×44 centered in 52×52 -->
    <rect x="4" y="4" width="44" height="44"
          fill="#1a0e04" stroke="none"/>
    <!-- Inner square: 31×31 centered at (26,26) → x=10.5, y=10.5 — wide amber fill -->
    <rect x="10.5" y="10.5" width="31" height="31"
          fill="#d4b87a" stroke="none"/>
    <!-- No center pip — wide amber fill is the defining feature -->
  </symbol>

<div class="card">
  <div class="card-fill"></div>
  <div class="card-image"><svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg"><use href="#art-d"/></svg></div>
  <div class="grad-top"></div>
  <div class="grad-body"></div>
  <div class="card-frame"><svg xmlns="http://www.w3.org/2000/svg"><use href="#frame-d"/></svg></div>
  <div class="card-header">
    <div class="type-band"><span class="type-label">Persona</span></div>
    <div class="card-title">The Last Stand</div>
    <div class="title-rule"></div>
  </div>

  <!--
    Actions section — one effect row for the single-use consumed marker.
    Option B: large 48×48 marker, wide amber inner square, no center pip.
    Token permanently consumed — no cooldown, no return path.
  -->
  <div class="mech-frame">
    <div class="mech-rule mech-rule-top"></div>
    <div class="mech-sections">

      <div class="sec sec-actions">

        <!-- Row 1 — consumed marker (one-time use), large variant -->
        <div class="effect-row">
          <div class="effect-lead">
            <svg width="48" height="48" viewBox="0 0 52 52" preserveAspectRatio="xMidYMid meet">
              <use href="#track-use-b-marker"/>
            </svg>
          </div>
          <span class="effect-text">
            Restore
            <span class="sym-group"><svg width="16" height="16"><use href="#icon-heal"/></svg><span class="sym-mod">6</span></span>
            — this action may never be used again
          </span>
        </div>

      </div>

    </div>
    <div class="mech-rule mech-rule-bot"></div>
  </div>
</div>
